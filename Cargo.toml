[package]
name = "ywatchy"
version = "0.4.1"
edition = "2021"
description = "Watches project folders to link Claude Code skills into ~/.claude/skills and keep CLAUDE.md files in sync with a store folder"
license = "MIT"
repository = "https://github.com/ycookiey/ywatchy"
readme = "README.md"
keywords = ["claude-code", "skills", "symlink", "file-watcher", "sync"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
notify = "8"
notify-debouncer-mini = "0.7"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
ctrlc = "3"
owo-colors = "4"
unicode-width = "0.2"
